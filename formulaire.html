<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma première page HTML</title>

  <style>
    #strengthBar {
      width: 250px;
      height: 10px;
      background-color: lightgray;
      margin-top: 10px;
    }

    #strengthIndicator {
      height: 100%;
      width: 0%;
      transition: 0.3s;
    }

    .faible {
      width: 40%;
      background-color: red;
    }

    .fort {
      width: 100%;
      background-color: green;
    }
  </style>
</head>

<body>

  <form id="monFormulaire">

    <div class="form-group">

      <label for="password">Mot de passe</label>

      <input type="password" id="password" required>

      <p id="passwordFeedback"></p>

      <div id="strengthBar">
        <div id="strengthIndicator"></div>
      </div>

    </div>

    <button type="submit" id="submitBtn" disabled>
      S'inscrire
    </button>

  </form>


  <script>

    function validerMotDePasse(motDePasse) {
      // au moins 8 caractères, au moins une lettre et au moins un chiffre
      const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[\.&#\-_]).{8,}$/;
      return regex.test(motDePasse);
    }


    const inputPassword =
      document.getElementById('password');

    const passwordFeedback =
      document.getElementById('passwordFeedback');

    const strengthIndicator =
      document.getElementById('strengthIndicator');


    inputPassword.addEventListener('input', (e) => {

      const estValide =
        validerMotDePasse(e.target.value);


      if (estValide) {

        passwordFeedback.textContent =
          "Mot de passe valide";

        strengthIndicator.className = "fort";

      } else {

        passwordFeedback.textContent =
          "Mot de passe invalide";

        strengthIndicator.className = "faible";

      }

    });

  </script>

</body>

</html>
